<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Web del TFG</title>
<style>
  body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#0f172a;color:#e2e8f0;text-align:center}
  a{color:#7dd3fc}
</style>
</head>
<body>
<main>
  <h1>Web del TFG</h1>
  <p id="msg">Conectando…</p>
</main>
<script>
// La URL del servidor (túnel en el móvil) cambia si se reinicia; el móvil la
// publica en url.json. La query evita que la caché de GitHub Pages sirva una vieja.
(async () => {
  const msg = document.getElementById('msg');
  try {
    const r = await fetch('url.json?t=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const {url} = await r.json();
    if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(url)) throw new Error('URL no válida');
    location.replace(url + '/');
  } catch (e) {
    msg.textContent = 'El servidor no está disponible ahora mismo. Inténtalo en un minuto.';
  }
})();
</script>
</body>
</html>
