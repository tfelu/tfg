<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Web del TFG</title>
<style>
  html,body{margin:0;height:100%;background:#f6f3ec;color:#1f1d1a;font-family:Georgia,"Times New Roman",serif}
  @media (prefers-color-scheme: dark){html,body{background:#191714;color:#ebe5d8}}
  h1{font-weight:600}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
  #msg{display:grid;place-items:center;height:100%;text-align:center;padding:0 16px}
</style>
</head>
<body>
<div id="msg"><main><h1>Web del TFG</h1><p id="status">Conectando…</p></main></div>
<iframe id="app" title="Web del TFG" allow="fullscreen; clipboard-write" referrerpolicy="no-referrer"></iframe>
<script>
// La web vive en un móvil detrás de un túnel cuya URL cambia al reiniciarse;
// el móvil la publica en url.json. La mostramos a pantalla completa dentro de
// un marco para que en la barra del navegador siempre ponga esta dirección fija.
const frame = document.getElementById('app');
const msg = document.getElementById('msg');
const status = document.getElementById('status');
const VALID = /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/;
let current = null;

async function latestUrl() {
  // La query evita que la caché de GitHub Pages sirva una URL vieja.
  const r = await fetch('url.json?t=' + Date.now(), {cache: 'no-store'});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const {url} = await r.json();
  if (!VALID.test(url)) throw new Error('URL no válida');
  return url;
}

async function refresh() {
  try {
    const url = await latestUrl();
    if (url !== current) {          // primera carga o el móvil cambió de túnel
      current = url;
      frame.src = url + '/';
      frame.style.display = 'block';
      msg.style.display = 'none';
    }
  } catch (e) {
    if (!current) status.textContent = 'El servidor no está disponible ahora mismo. Inténtalo en un minuto.';
  }
}

refresh();
// Si el móvil se reinicia durante la presentación, el marco se cambia solo a
// la nueva URL sin que el público tenga que recargar.
setInterval(refresh, 60000);
</script>
</body>
</html>
